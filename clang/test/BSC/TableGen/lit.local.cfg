# TableGen tests for the BSC diagnostic reference (`-gen-bsc-diag-docs`).
#
# `.td` is not one of the clang test suite's default test suffixes, so opt in
# for this subtree only (the sibling clang/test/TableGen does the same).
#
# The `Basic/BSC` subdirectory below is deliberate: the emitter classifies a
# diagnostic as coming from a BSC source file when its source path contains
# "/Basic/BSC/", and the completeness test relies on that.
config.suffixes = ['.td']
