name: Mirror BiSheng C compiler

# Daily mirror of the compiler branch from gitcode -> this repo. Force-pushes
# bishengc/15.0.4 to match the gitcode tip exactly — no overlay, no GitHub-side
# commits. The branch stays a pristine copy of gitcode's history.
#
#   source : https://gitcode.com/bisheng_c_language_dep/llvm-project.git (source of truth)
#   target : this repo, branch bishengc/15.0.4 (force-pushed: gitcode tip, verbatim)
#
# This workflow lives on bishengc_release (the default branch), so its schedule
# fires natively — no need to copy it onto bishengc/15.0.4 to register the cron.
#
# PUSH AUTH: pushes go over SSH with the MIRROR_SSH_KEY secret (a dedicated
# user key, revocable at github.com/settings/keys).
#
# The repo history is ~6.6M objects, so we keep a bare pack in the Actions cache
# (rolling key): the first run pays the full ~5 min fetch, later runs fetch only
# the daily delta (~1 min total).

on:
  schedule:
    - cron: "0 19 * * *"   # 03:00 Beijing
  push:
    branches: [bishengc_release]
    paths: ['.github/workflows/mirror-compiler.yml']
  workflow_dispatch: {}

permissions:
  contents: read           # pushes go over SSH, not the token

concurrency:
  group: mirror-compiler
  cancel-in-progress: false

env:
  SRC: https://gitcode.com/bisheng_c_language_dep/llvm-project.git
  BRANCH: bishengc/15.0.4

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Restore mirror pack cache
        uses: actions/cache/restore@v4
        with:
          path: mirror.git
          key: mirror-pack-${{ github.run_id }}   # never matches: always restores latest via restore-keys
          restore-keys: mirror-pack-

      - name: Fetch gitcode tip (full clone only on a cold cache)
        run: |
          if [ ! -d mirror.git ]; then
            echo "[INFO] cold cache — initial full fetch from gitcode (this run will be slow)"
            git init --bare mirror.git
            git --git-dir=mirror.git config gc.auto 0
          fi
          time git --git-dir=mirror.git fetch --no-tags "$SRC" "+refs/heads/$BRANCH:refs/heads/src"
          echo "[INFO] gitcode tip: $(git --git-dir=mirror.git rev-parse refs/heads/src)"

      # Fetch the current GitHub tip into mirror.git so the push step knows
      # which objects GitHub already has. Without this, push negotiates from
      # scratch and tries to upload everything reachable from the new tip —
      # for a ~6.6M-object repo that times out the SSH sideband mid-push.
      - name: Fetch current GitHub tip (thin negotiation)
        run: |
          git --git-dir=mirror.git fetch --no-tags \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "+refs/heads/$BRANCH:refs/heads/dst" || echo "[WARN] no existing target branch"

      - name: Set up SSH push key
        env:
          KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # SSH keepalive — large pushes were getting cut mid-sideband.
          printf 'Host github.com\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' >> ~/.ssh/config

      - name: Force-push bishengc/15.0.4 to match gitcode tip
        run: |
          set -euo pipefail
          SRC_TIP=$(git --git-dir=mirror.git rev-parse refs/heads/src)
          echo "[INFO] pushing gitcode tip $SRC_TIP to refs/heads/$BRANCH"
          # Retry on transient SSH disconnects.
          for attempt in 1 2 3; do
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes" \
                 git --git-dir=mirror.git push -f --progress \
                 "git@github.com:${{ github.repository }}.git" \
                 "$SRC_TIP:refs/heads/$BRANCH" 2>&1; then
              echo "[INFO] push succeeded on attempt $attempt"
              exit 0
            fi
            echo "[WARN] push attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "[ERROR] all 3 push attempts failed"
          exit 1

      - name: Compact loose objects
        run: git --git-dir=mirror.git repack -d -q || true

      - name: Save mirror pack cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mirror.git
          key: mirror-pack-${{ github.run_id }}
