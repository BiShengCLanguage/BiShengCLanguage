name: Publish BiSheng C Manual

# Builds the 4 manual editions (zh + en, release + preview) and deploys to GitHub
# Pages. Chinese content is the compiler manual fetched directly from gitcode
# (v5 REST API, then split with split_manual.py); English is the overlay on this
# branch, updated manually. Fully remote — no local machine involved.

# NOTE: the `schedule:` below has never fired and never will while this file lives
# only on book-ci — GitHub only schedules workflows on the DEFAULT branch. The real
# daily tick is BiShengCLanguage/ops, which dispatches this workflow every morning.
# The cron entry is kept as documentation of the intended cadence.

on:
  schedule:
    - cron: "30 4 * * *"   # documentation only — see NOTE above
  push:
    branches: [book-ci]    # rebuild when the overlay/script/workflow changes
  workflow_dispatch: {}    # manual "Run workflow" button + daily dispatch from ops

permissions:
  contents: read           # checkout of this branch; the manual itself comes from gitcode
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.4.40"
    steps:
      - name: Checkout book-ci (overlay + build script)
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build all editions
        run: |
          python3 --version
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
