name: Publish BiSheng C Manual

# Builds the 4 manual editions (zh + en, release + preview) and deploys to GitHub
# Pages. Chinese content is the compiler manual fetched directly from gitcode
# (v5 REST API, then split with split_manual.py); English is the overlay on this
# branch, updated manually. Fully remote — no local machine involved.

# SCHEDULING: GitHub only fires `schedule:` for workflow files on the DEFAULT branch.
# The daily mirror (mirror-compiler.yml) therefore carries a copy of this file onto
# the default branch in its overlay commit — that copy is what the schedule runs,
# which is why the checkout below pins ref: book-ci.

on:
  schedule:
    - cron: "0 20 * * *"   # 04:00 Beijing, an hour after the compiler mirror
  push:
    branches: [book-ci]    # rebuild when the overlay/script/workflow changes
  workflow_dispatch: {}    # manual "Run workflow" button

permissions:
  contents: read           # checkout of this branch; the manual itself comes from gitcode
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.4.40"
    steps:
      - name: Checkout book-ci (overlay + build script)
        uses: actions/checkout@v4
        with:
          ref: book-ci     # scheduled runs execute from the default branch — always build book-ci content

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build all editions
        run: |
          python3 --version
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
