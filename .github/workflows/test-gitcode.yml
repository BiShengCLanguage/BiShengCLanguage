name: Test gitcode reachability

# One-off probe: can a GitHub runner reach gitcode.com, and how fast?
#   1. v5 contents/commits API (what build.sh would use to fetch the manual)
#   2. shallow single-branch clone (small git-protocol sanity check)
#   3. full bare single-branch clone of bishengc/15.0.4 (mirror-on-Actions feasibility)
# Delete this workflow once the pipeline migration is decided.

on:
  push:
    branches: [book-ci]
    paths: ['.github/workflows/test-gitcode.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: API fetch manual (release + preview refs)
        run: |
          set -x
          P="clang/docs/BSC/BiShengCLanguageUserManual.md"
          time curl -fsSL -o rel.json "https://gitcode.com/api/v5/repos/bisheng_c_language_dep/llvm-project/contents/$P?ref=bishengc%2F15.0.4"
          python3 -c 'import json,base64,hashlib;d=json.load(open("rel.json"));b=base64.b64decode(d["content"]);h=hashlib.sha1(b"blob %d\x00"%len(b)+b).hexdigest();print("release bytes",len(b),"blobsha",h)'
          time curl -fsSL -o prev.json "https://gitcode.com/api/v5/repos/bisheng_c_language_dep/llvm-project/contents/$P?ref=bishengc_manual_preview"
          python3 -c 'import json,base64,hashlib;d=json.load(open("prev.json"));b=base64.b64decode(d["content"]);h=hashlib.sha1(b"blob %d\x00"%len(b)+b).hexdigest();print("preview bytes",len(b),"blobsha",h)'
          time curl -fsSL "https://gitcode.com/api/v5/repos/bisheng_c_language_dep/llvm-project/commits?sha=bishengc%2F15.0.4&path=$P&per_page=1" | head -c 300
      - name: Shallow single-branch clone
        run: |
          time git clone --depth 1 --single-branch -b bishengc_manual_preview --no-checkout \
            https://gitcode.com/bisheng_c_language_dep/llvm-project.git shallow
          du -sh shallow/.git
          rm -rf shallow
      - name: Full bare single-branch clone (mirror feasibility)
        run: |
          df -h / | tail -1
          time git clone --bare --single-branch -b bishengc/15.0.4 \
            https://gitcode.com/bisheng_c_language_dep/llvm-project.git full.git
          du -sh full.git
