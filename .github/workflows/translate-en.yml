name: Sync English Translation

# Daily: detect Chinese manual changes on gitcode since the last translated baseline,
# AI-translate the changed pages to English, and commit them to book-ci. The commit
# triggers "Publish BiSheng C Manual", which rebuilds and deploys the site.
#
# Translation runs through the GLM gateway via the `claude` CLI. Needs repo secrets
# GLM_BUNDLE_API_KEY / GLM_BUNDLE_API_KEY_2 / GLM_API_KEY (the script rotates through
# them) and GLM_GATEWAY. Without a usable key, translate-sync.sh is a safe no-op, so
# this workflow stays green and does nothing until the secrets are added.
#
# NOTE: the default GLM gateway is a private-network host; if GitHub-hosted runners
# can't reach it, run this workflow on a self-hosted runner on that network, or point
# GLM_GATEWAY at a publicly reachable endpoint.

on:
  schedule:
    - cron: "0 4 * * *"     # daily, 30 min before the publish schedule
  workflow_dispatch: {}

permissions:
  contents: write           # to commit updated English back to book-ci
  actions: write            # to dispatch the publish workflow after committing

concurrency:
  group: translate-en
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout book-ci
        uses: actions/checkout@v4
        with:
          ref: book-ci

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: AI-translate changed Chinese pages
        id: tr
        env:
          GLM_BUNDLE_API_KEY:   ${{ secrets.GLM_BUNDLE_API_KEY }}
          GLM_BUNDLE_API_KEY_2: ${{ secrets.GLM_BUNDLE_API_KEY_2 }}
          GLM_API_KEY:          ${{ secrets.GLM_API_KEY }}
          GLM_GATEWAY:          ${{ secrets.GLM_GATEWAY }}
          GLM_ENV: ""           # force env-var key source in CI (no local .env file)
        run: |
          chmod +x ./translate-sync.sh
          ./translate-sync.sh

      - name: Commit updated English (if any)
        id: commit
        if: steps.tr.outputs.changed != '0' && steps.tr.outputs.changed != ''
        run: |
          git config user.name  'BiSheng C Bot'
          git config user.email 'qq1105258717@gmail.com'
          git add overlay/en overlay/en-preview
          if git diff --cached --quiet; then
            echo "no file changes to commit"
            echo "pushed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "i18n: auto-sync English translation (${{ steps.tr.outputs.changed }} files changed)"
            git push origin book-ci
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does NOT trigger other workflows (GitHub's
      # loop-prevention). So when we actually pushed, explicitly dispatch the publish
      # workflow — workflow_dispatch IS permitted from GITHUB_TOKEN — to rebuild the site.
      - name: Trigger site publish
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-manual.yml --repo "$GITHUB_REPOSITORY" --ref book-ci
